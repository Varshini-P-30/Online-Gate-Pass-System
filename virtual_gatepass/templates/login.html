<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Gate Pass System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Optional: Add some styling for a modern look -->
    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            padding: 30px 40px;
        }
        .btn-custom {
            border-radius: 50px;
        }
        .form-control {
            border-radius: 10px;
        }
        .register-links a {
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-card">
                    <h2 class="text-center mb-4 text-primary fw-bold">Login</h2>

                    <!-- Flash Messages -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <!-- Login Form -->
                    <form method="POST" class="mb-3">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            {{ form.username }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            {{ form.password }}
                        </div>

                        <button type="submit" class="btn btn-primary btn-custom w-100 mt-2">Login</button>
                    </form>

                    <hr>

                    <!-- Registration Links -->
                    <p class="text-center mt-3 fw-semibold text-secondary">Don't have an account? Register as:</p>
                    <div class="d-grid gap-2 register-links">
                        <a href="{% url 'student_register' %}" class="btn btn-outline-primary btn-custom">🎓 Student</a>
                        <a href="{% url 'counsellor_register' %}" class="btn btn-outline-secondary btn-custom">🧑‍🏫 Counsellor</a>
                        <a href="{% url 'hod_register' %}" class="btn btn-outline-success btn-custom">🏛️ HOD</a>
                        <a href="{% url 'security_dashboard' %}" class="btn btn-outline-dark btn-custom">🛡️ Security</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
